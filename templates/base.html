<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}NutriGuru AI{% endblock %}</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- Google Fonts: Playfair Display (headings) | Nunito (subheadings/UI) | Inter (body) -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Nunito:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <!-- Animate.css -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet"/>
  <!-- Custom CSS — v3 -->
  <link href="{{ url_for('static', filename='css/style.css') }}?v=3" rel="stylesheet"/>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg fixed-top glass-nav" id="mainNav">
  <div class="container-fluid px-4">

    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
      <div class="brand-icon">🥗</div>
      <span class="brand-text">{{ agent_name }}</span>
      <span class="badge rounded-pill ms-1" style="background:var(--coral);color:#fff;font-size:0.58rem;letter-spacing:0.5px">AI</span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
        <li class="nav-item">
          <a class="nav-link nav-pill {% if request.endpoint == 'index' %}active{% endif %}" href="/">
            <i class="bi bi-grid-1x2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-pill {% if request.endpoint == 'chat' %}active{% endif %}" href="/chat">
            <i class="bi bi-chat-dots me-1"></i>AI Chat
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-pill {% if request.endpoint == 'meal_plan' %}active{% endif %}" href="/meal-plan">
            <i class="bi bi-calendar3 me-1"></i>Meal Plan
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-pill {% if request.endpoint == 'bmi' %}active{% endif %}" href="/bmi">
            <i class="bi bi-activity me-1"></i>BMI
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-pill {% if request.endpoint == 'family' %}active{% endif %}" href="/family">
            <i class="bi bi-people me-1"></i>Family
          </a>
        </li>
        <li class="nav-item ms-2">
          <button class="btn btn-sm theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── Main Content ─────────────────────────────────────────────────────────── -->
<main class="main-content">
  {% block content %}{% endblock %}
</main>

<!-- ── Footer ──────────────────────────────────────────────────────────────── -->
<footer class="footer-bar text-center py-3 mt-auto">
  <small class="text-muted">
    🥗 {{ agent_name }} &mdash; Powered by Groq + Llama 3 &nbsp;|&nbsp;
    Not a substitute for professional medical advice.
  </small>
</footer>

<!-- ── Toast Notifications ─────────────────────────────────────────────────── -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}?v=3"></script>
{% block scripts %}{% endblock %}
</body>
</html>
